<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>奶蛙消消乐 · 访客后台</title>
<style>
  :root{
    --bg:#eef4fa; --card:#ffffff; --line:#dde7f2; --ink:#17334d; --ink2:#5b7391; --ink3:#8fa4bd;
    --blue:#2b7fb8; --blue-l:#5fb3e0; --green:#2ec4a0; --gold:#f0b429; --purple:#8b7bd8; --red:#e0605e;
    --bar:#c9dfef; --bar-hi:linear-gradient(180deg,#5fb3e0,#2b7fb8);
    --shadow:0 8px 24px rgba(30,80,130,.08);
    --chip:rgba(46,196,160,.12);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1620; --card:#152230; --line:#22354a; --ink:#e6eff8; --ink2:#8fa6c0; --ink3:#6b819a;
      --blue:#5fb3e0; --blue-l:#7ec8ef; --green:#3dd6b0; --gold:#f5c453; --purple:#a99bf0; --red:#ff8a88;
      --bar:#2c455e; --bar-hi:linear-gradient(180deg,#7ec8ef,#2b7fb8);
      --shadow:0 8px 24px rgba(0,0,0,.35);
      --chip:rgba(61,214,176,.14);
    }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; padding:18px 16px 56px; min-height:100vh;
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-variant-numeric:tabular-nums;
  }
  .wrap{ max-width:760px; margin:0 auto; }
  header{ display:flex; align-items:center; gap:12px; margin:4px 0 18px; }
  .logo{ width:40px; height:40px; border-radius:14px; background:linear-gradient(140deg,#7ed3b2,#2b7fb8);
         display:grid; place-items:center; font-size:20px; box-shadow:var(--shadow); flex:none; }
  h1{ font-size:17px; margin:0; letter-spacing:.5px; }
  .sub{ font-size:12px; color:var(--ink2); margin-top:3px; }
  .grow{ flex:1; min-width:0; }
  .acts{ display:flex; gap:8px; flex:none; }
  button{ font:inherit; cursor:pointer; border:0; border-radius:11px; padding:9px 14px;
          background:var(--blue); color:#fff; font-weight:700; font-size:13px;
          transition:transform .12s, opacity .2s; white-space:nowrap; }
  button:active{ transform:scale(.96); }
  button.ghost{ background:var(--card); color:var(--ink2); border:1px solid var(--line); }
  button[disabled]{ opacity:.45; pointer-events:none; }

  /* 卡片 */
  .cards{ display:grid; grid-template-columns:repeat(2,1fr); gap:11px; margin-bottom:13px; }
  @media (min-width:600px){ .cards{ grid-template-columns:repeat(4,1fr); } }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px;
         padding:13px 14px 12px; box-shadow:var(--shadow); position:relative; overflow:hidden; }
  .k{ font-size:11px; font-weight:700; color:var(--ink2); letter-spacing:1px; }
  .v{ font-size:27px; font-weight:800; margin-top:5px; line-height:1.1; letter-spacing:-.5px; }
  .v small{ font-size:12px; font-weight:700; color:var(--ink2); margin-left:3px; letter-spacing:0; }
  .f{ font-size:11px; font-weight:700; color:var(--ink3); margin-top:7px; min-height:15px;
      display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .c-uv .v{ color:var(--blue); } .c-today .v{ color:var(--green); }
  .c-week .v{ color:var(--purple); } .c-peak .v{ color:var(--gold); }
  .cmp{ display:inline-flex; align-items:center; gap:3px; padding:2px 7px; border-radius:99px;
        font-size:11px; font-weight:800; background:var(--chip); color:var(--green); }
  .cmp.dn{ background:rgba(224,96,94,.12); color:var(--red); }
  .cmp.eq{ background:rgba(140,160,180,.14); color:var(--ink3); }

  .panel{ background:var(--card); border:1px solid var(--line); border-radius:16px;
          padding:15px 15px 10px; box-shadow:var(--shadow); margin-bottom:13px; }
  .panel-h{ display:flex; align-items:center; gap:9px; margin-bottom:10px; flex-wrap:wrap; }
  .panel-h b{ font-size:13px; letter-spacing:.5px; }
  .panel-h span{ font-size:11px; color:var(--ink2); }
  .panel-h .sp{ flex:1; }

  /* 区间切换 */
  .seg{ display:inline-flex; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:2px; }
  .seg button{ background:transparent; color:var(--ink2); font-size:12px; font-weight:800;
               padding:5px 11px; border-radius:8px; }
  .seg button.on{ background:var(--card); color:var(--blue); box-shadow:0 1px 4px rgba(30,80,130,.12); }

  /* 柱状图 */
  .chart{ display:flex; align-items:flex-end; gap:4px; height:164px; padding-top:24px; }
  @media (min-width:600px){ .chart{ gap:6px; } }
  .col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; height:100%;
        justify-content:flex-end; min-width:0; }
  .bar{ width:100%; max-width:44px; border-radius:6px 6px 3px 3px; background:var(--bar);
        min-height:3px; position:relative; transition:height .45s cubic-bezier(.2,.9,.3,1); }
  .bar.hi{ background:var(--bar-hi); }
  .bar.empty{ background:var(--line); }
  .bar .n{ position:absolute; top:-16px; left:50%; transform:translateX(-50%);
           font-size:10px; font-weight:800; color:var(--ink3); white-space:nowrap; }
  .bar.hi .n{ color:var(--blue); font-size:11px; }
  .x{ font-size:9px; color:var(--ink3); font-weight:700; letter-spacing:.2px; white-space:nowrap; }
  .x.today{ color:var(--green); }

  /* 明细 */
  .rows{ display:flex; flex-direction:column; }
  .row{ display:flex; align-items:center; gap:9px; padding:8px 0; border-top:1px solid var(--line); font-size:13px; }
  .row:first-child{ border-top:0; }
  .row .d{ color:var(--ink2); font-weight:700; font-size:12px; width:88px; flex:none; }
  .row .d em{ font-style:normal; color:var(--ink3); font-weight:700; font-size:10px; margin-left:4px; }
  .row .track{ flex:1; height:6px; border-radius:99px; background:var(--line); overflow:hidden; }
  .row .fill{ height:100%; border-radius:99px; background:var(--bar-hi); width:0; transition:width .5s ease-out; }
  .row .n{ width:44px; text-align:right; font-weight:800; }
  .row.zero .d, .row.zero .n{ color:var(--ink3); font-weight:700; }
  .row.zero .track{ background:transparent; }
  .blank{ padding:22px 0 18px; text-align:center; font-size:12px; color:var(--ink3); }
  .row.zero .track{ opacity:.45; }

  .gate{ max-width:340px; margin:18vh auto 0; background:var(--card); border:1px solid var(--line);
         border-radius:18px; padding:24px 20px; box-shadow:var(--shadow); text-align:center; }
  .gate h2{ font-size:15px; margin:0 0 6px; }
  .gate p{ font-size:12px; color:var(--ink2); margin:0 0 16px; line-height:1.6; }
  .gate input{ width:100%; padding:11px 13px; border-radius:11px; border:1px solid var(--line);
               background:var(--bg); color:var(--ink); font:inherit; font-size:14px; margin-bottom:10px; text-align:center; }
  .gate button{ width:100%; padding:11px; }
  .err{ color:var(--red); font-size:12px; font-weight:700; margin-top:10px; min-height:16px; }

  .hint{ font-size:11px; color:var(--ink3); text-align:center; line-height:1.8; margin-top:16px; }
  .hint code{ background:var(--card); border:1px solid var(--line); border-radius:5px; padding:1px 5px; font-size:10px; }
  .hide{ display:none !important; }
  .spin{ display:inline-block; width:9px; height:9px; border-radius:50%; border:2px solid var(--line);
         border-top-color:var(--blue); animation:spin .7s linear infinite; vertical-align:-1px; margin-right:5px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<div id="gate" class="gate hide">
  <h2>访客后台</h2>
  <p>奶蛙消消乐 · 只有站长能看</p>
  <input id="pw" type="password" placeholder="访问口令" autocomplete="off" inputmode="numeric">
  <button id="go">进入</button>
  <div class="err" id="err"></div>
</div>

<div id="main" class="wrap hide">
  <header>
    <div class="logo">🐸</div>
    <div class="grow">
      <h1>访客后台</h1>
      <div class="sub" id="updated">正在读取…</div>
    </div>
    <div class="acts">
      <button class="ghost" id="csv" title="导出 CSV">导出</button>
      <button class="ghost" id="reload">刷新</button>
    </div>
  </header>

  <div class="cards">
    <div class="card c-uv">
      <div class="k">累计访客</div>
      <div class="v" id="uv">–</div>
      <div class="f" id="uv-f"></div>
    </div>
    <div class="card c-today">
      <div class="k">今日访客</div>
      <div class="v" id="today">–</div>
      <div class="f" id="today-f"></div>
    </div>
    <div class="card c-week">
      <div class="k">近 7 天</div>
      <div class="v" id="week">–<small>人</small></div>
      <div class="f" id="week-f"></div>
    </div>
    <div class="card c-peak">
      <div class="k">单日峰值</div>
      <div class="v" id="peak">–<small>人</small></div>
      <div class="f" id="peak-f"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-h">
      <b>访客趋势</b>
      <span class="sp"></span>
      <div class="seg" id="seg">
        <button data-n="7" class="on">7 天</button>
        <button data-n="14">14 天</button>
        <button data-n="30">30 天</button>
      </div>
    </div>
    <div class="chart" id="chart"></div>
  </div>

  <div class="panel">
    <div class="panel-h">
      <b>每日明细</b><span id="sumTxt"></span>
      <span class="sp"></span>
      <span id="avgTxt"></span>
    </div>
    <div class="rows" id="rows"></div>
  </div>

  <div class="hint">
    数据源 <code>abacus.jasoncameron.dev</code><br>
    按浏览器去重，同一天多次打开只算一人 · 游戏里不显示任何数字
  </div>
</div>

<script>
(function(){
  'use strict';
  var API = 'https://abacus.jasoncameron.dev';
  var NS  = 'naiwaxxl';
  var KEY = 'uv3';
  var LS  = 'naiwa-admin-ok';
  var CACHE_KEY = 'naiwa-stat-cache-v3';
  var WIN_KEY   = 'naiwa-stat-win';      /* 限速窗口落盘：刷新页面也接着用同一份额度 */
  var AUTO_KEY  = 'naiwa-admin-auto';
  var MAXDAYS = 30;            /* 一次最多回看多少天 */

  /* ---------- 口令门 ----------
     源码里不存明文口令，只存 PBKDF2-SHA256(30 万轮) 的哈希；输入的口令在本机
     现算现比，页面上任何地方都搜不到原始密码。
     换口令：把新口令代入下面这行命令，用输出替换 PASS_HASH 即可 ↓
     node -e "console.log(require('crypto').pbkdf2Sync('新口令','naiwa-xxl-admin-v1',300000,32,'sha256').toString('hex'))" */
  var SALT = 'naiwa-xxl-admin-v1';
  var ITER = 300000;
  var PASS_HASH = '4cb7c1c605485cbb9cd5db6c54db9563a7573f71f826278c7cd2675be0d74a9f';
  /* 会话标记绑在哈希上：换口令后，旧标签页的免密状态自动失效 */
  var SESSION_TAG = 'v' + PASS_HASH.slice(0, 12);

  var $ = function(id){ return document.getElementById(id); };

  function hexOf(buf){
    var a = new Uint8Array(buf), s = '';
    for(var i = 0; i < a.length; i++) s += ('0' + a[i].toString(16)).slice(-2);
    return s;
  }
  function checkPass(v){
    if(!v || !window.crypto || !crypto.subtle) return Promise.resolve(false);
    var enc = new TextEncoder();
    try{
      return crypto.subtle.importKey('raw', enc.encode(v), { name: 'PBKDF2' }, false, ['deriveBits'])
        .then(function(k){
          return crypto.subtle.deriveBits(
            { name: 'PBKDF2', salt: enc.encode(SALT), iterations: ITER, hash: 'SHA-256' }, k, 256);
        })
        .then(function(bits){ return hexOf(bits) === PASS_HASH; })
        .catch(function(){ return false; });
    }catch(e){ return Promise.resolve(false); }
  }

  function unlock(){
    $('gate').classList.add('hide');
    $('main').classList.remove('hide');
    load();
    startAuto();
  }
  function showGate(msg){
    $('main').classList.add('hide');
    $('gate').classList.remove('hide');
    $('err').textContent = msg || '';
    try{ $('pw').focus(); }catch(e){}
  }
  /* 连错递增冷却：1s → 2s → 4s → 8s → 16s，挡在线暴力试 */
  var tries = 0;
  function tryPass(v){
    var btn = $('go');
    btn.disabled = true;
    $('err').textContent = '校验中…';
    checkPass(v).then(function(ok){
      if(ok){
        tries = 0;
        $('err').textContent = '';
        $('pw').value = '';
        try{ sessionStorage.setItem(LS, SESSION_TAG); }catch(e){}
        unlock();
      }else{
        tries++;
        var wait = Math.pow(2, Math.min(tries - 1, 4));
        $('err').textContent = '口令不对，' + wait + ' 秒后可再试';
        setTimeout(function(){
          btn.disabled = false;
          if($('err').textContent.indexOf('秒后可再试') >= 0) $('err').textContent = '口令不对';
        }, wait * 1000);
      }
    });
  }

  $('go').addEventListener('click', function(){ tryPass($('pw').value.trim()); });
  $('pw').addEventListener('keydown', function(e){ if(e.key === 'Enter') tryPass(this.value.trim()); });
  $('reload').addEventListener('click', function(){ load(true); });
  $('csv').addEventListener('click', exportCsv);
  $('seg').addEventListener('click', function(e){
    var b = e.target.closest('button');
    if(!b) return;
    var n = +b.getAttribute('data-n');
    if(n === viewDays) return;
    [].forEach.call($('seg').children, function(x){ x.classList.toggle('on', x === b); });
    switchDays(n);
  });

  /* ---------- 取数（带缓存 + 分批并发） ---------- */
  var cache = (function(){
    try{ return JSON.parse(localStorage.getItem(CACHE_KEY) || '{}') || {}; }catch(e){ return {}; }
  })();
  function saveCache(){
    try{
      var cut = dayList(45)[0];                 /* 只留最近 45 天 */
      Object.keys(cache).forEach(function(k){
        if(k.indexOf('d3-') === 0 && k.slice(3) < cut) delete cache[k];
      });
      localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
    }catch(e){}
  }
  function todayKey(){
    var d = new Date();
    return '' + d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
  }
  function readRaw(key, attempt){
    attempt = attempt || 0;
    return fetch(API + '/get/' + NS + '/' + key, { cache: 'no-store' })
      .then(function(r){
        if(r.status === 404) return 0;                    /* 没有这个 key = 0，不是失败 */
        if(r.status === 429 && attempt < 3){              /* 被限流：退避后重试（重试也要过限速闸） */
          return new Promise(function(res){ setTimeout(res, 1500 * (attempt + 1)); })
            .then(gate)
            .then(function(){ return readRaw(key, attempt + 1); });
        }
        if(!r.ok) return null;
        return r.json().then(function(d){ return (d && typeof d.value === 'number') ? d.value : 0; });
      })
      .catch(function(){ return null; });
  }
  /* 缓存策略：
     · 历史日期的桶（d2-YYYYMMDD 且不是今天）不会再变 → 永久命中，连 localStorage 都不用刷新
     · 今天的桶和累计 uv 会变 → 20 秒内复用，超了重拉
     两条都要落盘，否则每次打开后台都要重发 7~30 个请求（慢，还容易撞限流）。 */
  var dayStamp = todayKey();
  function isHistDay(key){
    return key.indexOf('d3-') === 0 && key !== 'd3-' + dayStamp;
  }
  function readKey(key){
    var c = cache[key];
    if(c && typeof c.v === 'number'){
      if(isHistDay(key)) return Promise.resolve(c.v);
      if(Date.now() - c.t < 20000) return Promise.resolve(c.v);
    }
    return readRaw(key).then(function(v){
      if(v !== null){
        cache[key] = { v: v, t: Date.now() };
        saveCache();
      }
      return v;
    });
  }
  /* abacus 的限额是「每 IP 30 次 / 10 秒」（响应头 ratelimit-policy: 30;w=10）。
     并发 6 个必炸；单纯 60ms 间隔跑 30 个也会炸。这里用滑动窗口事前限流：
     10 秒内最多发 26 个，超了就等到最早那次过期。短序列（7 天 8 个）完全不受影响。 */
  var win = (function(){
    try{
      return JSON.parse(localStorage.getItem(WIN_KEY) || '[]').filter(function(t){ return typeof t === 'number'; });
    }catch(e){ return []; }
  })();
  function saveWin(){ try{ localStorage.setItem(WIN_KEY, JSON.stringify(win)); }catch(e){} }
  function gate(){
    var now = Date.now();
    win = win.filter(function(t){ return now - t < 10000; });
    if(win.length < 26){ win.push(now); saveWin(); return Promise.resolve(); }
    return new Promise(function(r){ setTimeout(r, 10000 - (now - win[0]) + 60); }).then(gate);
  }
  /* 只给真要发网络的 key 占窗口，命中缓存的不浪费名额 */
  function willFetch(key){
    var c = cache[key];
    if(!c || typeof c.v !== 'number') return true;
    if(isHistDay(key)) return false;
    return Date.now() - c.t >= 20000;
  }
  /* 3 路并发（限额是 10 秒 26 个，3 路远够不到），结果按入参顺序返回。
     原来纯串行：8 个请求 × 每个 600ms 往返 = 5.7s 才出数，太慢。 */
  var POOL = 3;
  function readSeq(keys, onProgress){
    var out = new Array(keys.length), done = 0, next = 0;
    function worker(){
      if(next >= keys.length) return Promise.resolve();
      var i = next++;
      var k = keys[i];
      var wait = willFetch(k) ? gate() : Promise.resolve();
      return wait.then(function(){ return readKey(k); }).then(function(v){
        out[i] = v;
        done++;
        if(onProgress) onProgress(done, keys.length);
        return worker();
      });
    }
    var ws = [];
    for(var w = 0; w < POOL; w++) ws.push(worker());
    return Promise.all(ws).then(function(){ return out; });
  }

  /* ---------- 日期工具 ---------- */
  function ymd(d){
    return '' + d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
  }
  function dayList(n){
    var a = [], i, d;
    for(i = n - 1; i >= 0; i--){
      d = new Date(); d.setDate(d.getDate() - i);
      a.push(ymd(d));
    }
    return a;
  }
  function md(s){ return +s.slice(4, 6) + '/' + +s.slice(6, 8); }
  function dash(s){ return s.slice(0, 4) + '-' + s.slice(4, 6) + '-' + s.slice(6, 8); }

  /* ---------- 状态 ---------- */
  var viewDays = 7;                        /* 默认 7 天视图，首屏只发 8 个请求 */
  var data = { uv: null, map: {}, ok: true };
  var autoTimer = null;

  function has(d){ return Object.prototype.hasOwnProperty.call(data.map, d); }
  function valOf(d){ return has(d) ? data.map[d] : 0; }
  function sumOf(days){ return days.reduce(function(a, d){ return a + valOf(d); }, 0); }

  /* 按需补数据：只请求还没拿到的那几天，已经有的走缓存不发请求 */
  function ensureDays(n, force, quiet){
    var todo = dayList(n).filter(function(d){ return force || !has(d); });
    if(!todo.length) return Promise.resolve(true);
    var prog = quiet ? null : function(done, total){
      $('updated').innerHTML = '<span class="spin"></span>正在读取 ' + done + '/' + total;
    };
    return readSeq(todo.map(function(d){ return 'd3-' + d; }), prog).then(function(vs){
      var ok = true;
      todo.forEach(function(d, i){
        if(typeof vs[i] === 'number') data.map[d] = vs[i];
        else ok = false;
      });
      return ok;
    });
  }

  function hhmm(){
    var n = new Date();
    return ('0' + n.getHours()).slice(-2) + ':' + ('0' + n.getMinutes()).slice(-2);
  }
  function finish(ok){
    $('reload').disabled = false;
    $('updated').textContent = '更新于 ' + hhmm() + (ok ? '' : ' · 部分数据读取失败（点刷新重试）');
  }

  /* 三段式：先给 7 天立刻出数 → 再补到 14 天（对比要用）→ 切 30 天时按需补 */
  function load(force){
    $('reload').disabled = true;
    if(force){
      data = { uv: null, map: {}, ok: true };
      delete cache[KEY];
      delete cache['d3-' + dayStamp];
    }
    var okAll = true;
    $('updated').innerHTML = '<span class="spin"></span>正在读取…';
    var head = data.uv === null
      ? readKey(KEY).then(function(uv){ if(uv !== null) data.uv = uv; else okAll = false; })
      : Promise.resolve();

    head
      .then(function(){ return ensureDays(7, !!force); })
      .then(function(ok){
        okAll = okAll && ok;
        render();
        finish(true);                                  /* 7 天先出结果，界面立刻可用 */
        return ensureDays(14, !!force, true);          /* 剩下 7 天静默补，不打扰 */
      })
      .then(function(ok){ okAll = okAll && ok; render(); finish(okAll); })
      .catch(function(){ finish(false); });
  }

  /* 点区间：先按现有数据画出来，缺的再补，补完重画 */
  function switchDays(n){
    viewDays = n;
    $('reload').disabled = true;          /* 缺的天数在补，期间别让人狂点刷新 */
    render();
    ensureDays(n).then(function(ok){ render(); finish(ok); });   /* 补完一定要收掉"正在读取" */
  }

  /* ---------- 渲染 ---------- */
  function cmpHtml(cur, prev, label, known){
    if(!known) return '<span class="cmp eq">—</span>';
    if(prev === 0 && cur === 0) return '<span class="cmp eq">持平</span>';
    if(prev === 0) return '<span class="cmp">+' + cur + '</span><span>' + (label || '') + '</span>';
    var p = Math.round((cur - prev) / prev * 100);
    if(p === 0) return '<span class="cmp eq">持平</span>';
    return '<span class="cmp' + (p > 0 ? '' : ' dn') + '">' + (p > 0 ? '↑' : '↓') + Math.abs(p) + '%</span>'
         + '<span>' + (label || '') + '</span>';
  }

  function render(){
    var showD = dayList(viewDays);
    var showV = showD.map(valOf);

    var d2 = dayList(2);                               /* [昨天, 今天] */
    var last = valOf(d2[1]), yest = valOf(d2[0]);

    var w14 = dayList(14);
    var wk = sumOf(w14.slice(7));                      /* 近 7 天 */
    var prevWk = sumOf(w14.slice(0, 7));               /* 前 7 天 */
    var wkKnown = w14.slice(0, 7).every(has);

    /* 峰值只在「当前视图至少 14 天」的范围内取，副文案标出区间，免得数字口径不明 */
    var pkN = Math.max(viewDays, 14);
    var pk = 0, pkDay = '';
    dayList(pkN).forEach(function(d){ if(valOf(d) > pk){ pk = valOf(d); pkDay = d; } });
    var loadedN = Object.keys(data.map).length;

    $('uv').textContent = (data.uv === null) ? '—' : data.uv.toLocaleString('en-US');
    $('uv-f').textContent = (data.uv === null) ? '' : '同浏览器只算一次';

    $('today').textContent = last.toLocaleString('en-US');
    $('today-f').innerHTML = cmpHtml(last, yest, '较昨日 ' + yest + ' 人次', true);

    $('week').innerHTML = wk.toLocaleString('en-US') + '<small>人</small>';
    $('week-f').innerHTML = cmpHtml(wk, prevWk, '较前 7 天 ' + prevWk + ' 人次', wkKnown);

    $('peak').innerHTML = pk.toLocaleString('en-US') + '<small>人</small>';
    $('peak-f').textContent = pk ? ('近 ' + pkN + ' 天最高 · ' + md(pkDay)) : '还没有数据';

    /* 柱状图 */
    var max = Math.max.apply(null, showV.concat([1]));
    var labelEvery = viewDays > 14 ? Math.ceil(viewDays / 6) : 1;   /* 30 天时只标 6 个日期 */
    var html = '';
    for(var i = 0; i < viewDays; i++){
      var v = showV[i];
      var h = v ? Math.max(4, Math.round(v / max * 100)) : 0;
      var isToday = (i === viewDays - 1);
      /* 30 天时只标 6 个刻度，其余留空，免得日期挤成一团 */
      var tick = (labelEvery === 1) || isToday || ((viewDays - 1 - i) % labelEvery === 0);
      var showLabel = v && (viewDays <= 14 || tick || v === max);   /* 30 天时至少把最高的那根标出来 */
      html += '<div class="col">'
            + '<div class="bar' + (isToday ? ' hi' : '') + (v ? '' : ' empty') + '" style="height:' + Math.max(h, 3) + '%">'
            + (showLabel ? '<span class="n">' + v + '</span>' : '') + '</div>'
            + '<div class="x' + (isToday ? ' today' : '') + '">' + (tick ? md(showD[i]) : '&nbsp;') + '</div>'
            + '</div>';
    }
    $('chart').innerHTML = html;

    /* 明细 */
    var tot = sumOf(showD);
    var act = showV.filter(function(v){ return v > 0; }).length;
    var mm = Math.max.apply(null, showV.concat([1]));
    var rows = '', zeros = 0;
    for(i = viewDays - 1; i >= 0; i--){
      if(showV[i] === 0){ zeros++; continue; }              /* 零访客的日子折到一行，不占版面 */
      rows += '<div class="row">'
            + '<div class="d">' + md(showD[i]) + (i === viewDays - 1 ? '<em>今天</em>' : '') + '</div>'
            + '<div class="track"><div class="fill" style="width:' + Math.round(showV[i] / mm * 100) + '%"></div></div>'
            + '<div class="n">' + showV[i] + '</div></div>';
    }
    if(!act) rows = '<div class="blank">这段时间还没有访客</div>';
    else if(zeros) rows += '<div class="row zero"><div class="d">另有 ' + zeros + ' 天</div>'
                         + '<div class="track"></div><div class="n">0</div></div>';
    $('rows').innerHTML = rows;
    $('sumTxt').textContent = viewDays + ' 天合计 ' + tot + ' 人次';
    $('avgTxt').textContent = act
      ? ('有访客 ' + act + ' 天 · 活跃日日均 ' + (tot / act).toFixed(1) + ' 人')
      : (loadedN ? '暂无访客' : '');
  }

  /* ---------- 导出 CSV ---------- */
  function exportCsv(){
    var days = dayList(MAXDAYS).filter(has);        /* 只导出已经读到的日期 */
    if(!days.length) return;
    var lines = ['日期,访客数'];
    var tot = 0;
    for(var i = 0; i < days.length; i++){
      lines.push(dash(days[i]) + ',' + data.map[days[i]]);
      tot += data.map[days[i]];
    }
    lines.push('合计,' + tot);
    if(data.uv !== null) lines.push('累计独立访客,' + data.uv);
    var blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'naiwa-visits-' + dayStamp + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
  }

  /* ---------- 自动刷新：只刷「累计 + 今天」，历史走缓存 ---------- */
  function startAuto(){
    if(autoTimer) clearInterval(autoTimer);
    autoTimer = setInterval(function(){
      if(document.hidden) return;
      var nowDay = todayKey();
      if(nowDay !== dayStamp){          /* 过零点了：新的一天要重新拉，不然今日永远是昨天的值 */
        dayStamp = nowDay;
        load(false);
        return;
      }
      delete cache[KEY];
      delete cache['d3-' + nowDay];
      readKey(KEY).then(function(uv){
        if(uv !== null) data.uv = uv;
        return readKey('d3-' + nowDay);
      }).then(function(t){
        if(t !== null) data.map[nowDay] = t;
        render();
        $('updated').textContent = '更新于 ' + hhmm() + ' · 每分钟自动刷新';
      }).catch(function(){});
    }, 60000);
  }
  /* ---------- 入口：口令判断放在最后 ----------
     必须等上面所有状态（data / viewDays / cache…）都初始化完再 unlock()，
     否则 load() 里读 data.uv 会 TypeError（var 提升但还没赋值）。
     之前这段放在文件前半段，结果就是「同一标签页再打开时页面空白、数字不出来」。 */
  var qs = new URLSearchParams(location.search);
  var saved = '';
  try{ saved = sessionStorage.getItem(LS) || ''; }catch(e){}
  if(saved === SESSION_TAG){
    unlock();
  }else if(qs.get('k')){
    checkPass(qs.get('k')).then(function(ok){
      if(ok){ try{ sessionStorage.setItem(LS, SESSION_TAG); }catch(e){} unlock(); }
      else showGate('链接里的口令不对');
    });
  }else{
    showGate((window.crypto && crypto.subtle) ? '' : '需要用 https 打开本页');
  }

})();
</script>
