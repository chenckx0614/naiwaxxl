<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>奶蛙消消乐</title>
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#a9c8f2">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { height:100%; }
  body {
    font-family: "PingFang SC","Microsoft YaHei",sans-serif;
    background: radial-gradient(circle at 50% 20%, #d3e4fb 0%, #a9c8f2 45%, #8ab0e8 100%);
    display:flex; justify-content:center; align-items:flex-start;
    min-height:100%; overflow-x:hidden;
  }

  /* min-height:100% + justify-content:center：内容比视口矮时上下均分留白（原来是顶部对齐，
     高屏手机上棋盘下方会空出一大片）。内容高于视口时 min-height 不生效，顶部不会被裁。 */
  #app { width:min(460px, 100vw); padding:14px 12px 24px; display:flex; flex-direction:column; align-items:center; gap:14px;
         min-height:100%; justify-content:center; }

  /* ---------- 顶部信息栏 ---------- */
  #topbar { display:flex; align-items:center; gap:8px; width:100%; justify-content:space-between; }
  .stat-panel {
    background:linear-gradient(#6ea7ec,#4f87d8);
    border:3px solid #3f6fc0; border-radius:16px;
    color:#fff; text-align:center; padding:5px 10px;
    box-shadow: 0 3px 0 #35609f, inset 0 2px 2px rgba(255,255,255,.45);
    min-width:64px;
  }
  .stat-panel .label { font-size:13px; font-weight:700; text-shadow:0 1px 1px rgba(0,0,0,.25); }
  .stat-panel .value { font-size:26px; font-weight:900; line-height:1.05; text-shadow:0 2px 2px rgba(0,0,0,.2); }

  #goal-panel {
    flex:1; min-width:0; background:#fdf6e3; border:3px solid #6ea7ec; border-radius:16px;
    padding:6px 12px; align-self:center; min-height:54px;
    box-shadow: 0 3px 0 #b98f4e33, inset 0 0 0 2px #fff, 0 3px 6px rgba(50,90,160,.25);
    display:flex; align-items:center; gap:10px;
  }
  #goal-panel .goal-tab {
    background:linear-gradient(#6ea7ec,#4f87d8); color:#fff; font-weight:800; font-size:13px;
    padding:5px 10px; border-radius:999px; border:2px solid #3f6fc0; flex-shrink:0;
    box-shadow:0 2px 0 #35609f; text-shadow:0 1px 1px rgba(0,0,0,.25);
  }
  /* min-width:0 + overflow-x 让目标不够放时横向滚动，而不是把右侧「关卡 / 齿轮」挤出屏幕 */
  #goals { flex:1; min-width:0; display:flex; justify-content:space-evenly; align-items:center; overflow-x:auto; }
  #goals::-webkit-scrollbar { display:none; }
  .goal-item {
    flex:0 0 auto;
    display:flex; align-items:center; gap:5px;
    background:rgba(255,255,255,.75); border-radius:999px; padding:3px 10px 3px 6px;
    box-shadow:inset 0 1px 3px rgba(160,120,60,.18);
  }
  .goal-item .g-icon { width:24px; height:24px; display:flex; align-items:center; justify-content:center; filter:drop-shadow(0 2px 1px rgba(0,0,0,.2)); transition:transform .2s, filter .2s, opacity .2s; }
  .goal-item .g-icon img { width:100%; height:100%; object-fit:contain; display:block; }
  .goal-item .g-num { font-size:17px; font-weight:900; color:#8a5a1e; min-width:16px; text-align:center; }
  .goal-item.done .g-icon { filter:grayscale(.4) drop-shadow(0 2px 1px rgba(0,0,0,.15)); opacity:.55; }
  .goal-item.done .g-num { color:#4caf50; }

  #gear-btn {
    width:46px; height:46px; border-radius:50%; border:3px solid #3f6fc0;
    background:linear-gradient(#7db4f2,#5793e0); color:#fff; font-size:22px;
    box-shadow:0 3px 0 #35609f, inset 0 2px 2px rgba(255,255,255,.5);
    cursor:pointer; flex-shrink:0; transition:transform .1s;
  }
  #gear-btn:active { transform:scale(.92); }

  /* 顶栏紧凑档：容器 #app 上限 460px（顶栏实际 <=436px），
     所以不能按视口宽度做断点，直接按窄屏尺寸定死，「步数/目标/关卡/齿轮」才都进得来 */
  #topbar { gap:5px; }
  .stat-panel { min-width:44px; padding:4px 6px; }
  .stat-panel .label { font-size:12px; }
  .stat-panel .value { font-size:22px; }
  #goal-panel { padding:5px 8px; gap:6px; }
  #goal-panel .goal-tab { font-size:12px; padding:4px 8px; }
  .goal-item { padding:2px 6px 2px 4px; gap:4px; }
  .goal-item .g-icon { width:20px; height:20px; }
  .goal-item .g-num { font-size:14px; min-width:12px; }
  #gear-btn { width:40px; height:40px; font-size:19px; }

  /* 极窄屏（<=420）：先隐藏装饰性的「目标」标签，把空间让给三个目标图标 */
  @media (max-width:420px) {
    #goal-panel .goal-tab { display:none; }
  }

  /* ---------- 棋盘 ---------- */
  #board-wrap {
    width:100%; background:rgba(255,255,255,.35);
    border:3px solid #6ea7ec; border-radius:18px; padding:8px;
    box-shadow: inset 0 2px 8px rgba(60,100,170,.25), 0 4px 10px rgba(60,100,170,.2);
    overflow:hidden; /* 新棋子从棋盘上沿落入时，裁掉棋盘外的部分 */
  }
  #board { position:relative; width:100%; aspect-ratio:1/1; touch-action:none; }
  .cell-bg {
    position:absolute; background:#dbe7fa; border-radius:10px;
    box-shadow: inset 0 2px 3px rgba(80,120,190,.18);
  }
  .cell-bg.inactive { opacity:0.25; background:#c8d9f0; box-shadow:none; }
  .tile {
    position:absolute; display:flex; align-items:center; justify-content:center;
    font-size:0; cursor:pointer; border-radius:10px;
    /* 位移由 Web Animations 的显式关键帧负责（见 moveTileTo）。
       这里刻意不写 transition / will-change：will-change 会把过渡交给合成器线程，
       而新建图层那一帧的起始 transform 可能退化成 none，导致棋子从棋盘左上角飞入。 */
  }
  .tile .face {
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    pointer-events:none; transition:transform .15s;
    border-radius:50%;
  }
  .tile .face img { width:88%; height:88%; object-fit:contain; display:block; filter:drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
  /* 牢笼棋子：不能交换/拖动，但可参与匹配和被道具消除 */
  .tile.caged { cursor:not-allowed; }
  .tile.caged .face { position:relative; }
  .tile.caged .face::after {
    content:""; position:absolute; inset:3px; border-radius:50%;
    border:3px dashed rgba(120,80,40,.55);
    background:
      repeating-linear-gradient(0deg, transparent, transparent 5px, rgba(120,80,40,.18) 5px, rgba(120,80,40,.18) 8px),
      repeating-linear-gradient(90deg, transparent, transparent 5px, rgba(120,80,40,.18) 5px, rgba(120,80,40,.18) 8px);
    pointer-events:none;
  }
  .tile.caged .face img { opacity:0.92; }
  /* 设置里关闭「动画」时全局禁用过渡 */
  .no-anim .tile, .no-anim .tile .face { transition:none !important; }
  /* 跟手拖动中：抬起放大 + 置于最上层。位移仍由 JS 直接写 transform，
     这里绝对不能加 transition（会退回合成器线程竞态） */
  .tile.dragging { z-index:7; }
  .tile.dragging .face { transform:scale(1.12); }
  .tile.selected .face { animation:bounce .45s infinite alternate; }
  .tile.selected { z-index:5; }
  .tile.selected::after {
    content:""; position:absolute; inset:-3px; border-radius:12px;
    border:3px solid #ffb400; box-shadow:0 0 10px #ffd54d;
  }
  /* 消除收缩：时长与 app.js 的 POP_MS 保持一致（下落会在这段时间的前半程就开始） */
  .tile.clearing .face { animation:pop .2s forwards; }
  .tile.hint .face { animation:bounce .5s infinite alternate; }
  @keyframes pop {
    0%   { transform:scale(1) rotate(0deg); opacity:1; }
    42%  { transform:scale(1.30) rotate(-7deg); opacity:1; }
    72%  { transform:scale(.80) rotate(6deg); opacity:.85; }
    100% { transform:scale(0) rotate(14deg); opacity:0; }
  }
  /* 消除粒子碎片：JS 动态生成，飞散后立刻移除（见 burst） */
  .shard { position:absolute; border-radius:2px; pointer-events:none; z-index:6; }
  @keyframes bounce { from { transform:scale(1);} to { transform:scale(1.18);} }

  /* 滑向不可去的格子（棋盘外 / 菱形缺角 / 牢笼）时的轻反馈。
     只抖内层 .face —— .tile 的 transform 是 inline 定位，CSS 动画一旦落在 .tile 上
     会把它整个覆盖，棋子会飞到棋盘左上角。 */
  .tile .face.bump { animation:faceBump .22s ease; }
  @keyframes faceBump {
    0% { transform:translateX(0); }
    30% { transform:translateX(-4px); }
    70% { transform:translateX(4px); }
    100% { transform:translateX(0); }
  }

  /* ---------- 底部道具栏 ----------
     圆钮造型参考 Uiverse.io（GitHub: uiverse-io/galaxy，MIT）里的
     拟物/新拟态圆形按钮：糖果立体感 = 硬厚度阴影 + 顶部弧形高光 + 按下整体下沉。
     图标为 Microsoft Fluent Emoji 3D（MIT，GitHub: microsoft/fluentui-emoji）
     转出的本地 WebP：同一套 3D 渲染风格，避免各端 emoji 字体渲染不一致。 */
  #boosters {
    display:flex; align-items:center; justify-content:space-around;
    margin-top:6px; padding:9px 6px;
    background:linear-gradient(#f3f8ff,#dbe8ff);
    border:2px solid #a9c8f0; border-radius:22px;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.95), inset 0 -4px 8px rgba(90,130,200,.18), 0 4px 10px rgba(60,100,170,.16);
  }

  .booster {
    position:relative; width:62px; height:62px; border-radius:50%;
    border:none; padding:0; cursor:pointer; overflow:visible;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(165deg,#ffffff 0%,#eaf2ff 46%,#c8dcf8 100%);
    box-shadow:
      0 5px 0 #8db2e4,
      0 9px 12px rgba(50,90,160,.28),
      inset 0 2px 2px rgba(255,255,255,.95),
      inset 0 -3px 7px rgba(110,150,210,.35);
    transition:transform .09s ease, box-shadow .09s ease, filter .2s ease, opacity .2s ease;
  }
  .booster::before {                 /* 顶部弧形高光：糖果釉面 */
    content:""; position:absolute; left:12%; top:7%; width:76%; height:42%;
    border-radius:50%; pointer-events:none;
    background:radial-gradient(ellipse at 50% 25%, rgba(255,255,255,.98), rgba(255,255,255,.3) 58%, rgba(255,255,255,0) 78%);
  }
  .booster img { width:60%; height:60%; display:block; pointer-events:none; filter:drop-shadow(0 2px 2px rgba(40,70,130,.3)); }
  .booster:active {                  /* 按下：整体下沉，厚度阴影收薄 */
    transform:translateY(5px);
    box-shadow:0 1px 0 #8db2e4, 0 2px 4px rgba(50,90,160,.28),
               inset 0 2px 2px rgba(255,255,255,.9), inset 0 -2px 6px rgba(110,150,210,.45);
  }
  .booster:active img { transform:scale(.94); }
  .booster.armed {                   /* 已选中待用（小锤 / 炸弹瞄准中） */
    background:linear-gradient(165deg,#fffdf3 0%,#ffe9a8 55%,#ffcf5c 100%);
    box-shadow:0 5px 0 #d99a15, 0 9px 14px rgba(180,120,0,.35),
               inset 0 2px 2px rgba(255,255,255,.95), inset 0 -3px 7px rgba(200,140,20,.4);
  }
  .booster.armed::after {
    content:""; position:absolute; top:-6px; right:-6px; bottom:-6px; left:-6px;
    border-radius:50%; border:3px solid #ffb400; box-shadow:0 0 12px rgba(255,200,60,.9);
    animation:armedRing .9s ease-in-out infinite alternate;
  }
  @keyframes armedRing { from { transform:scale(.97); opacity:.7; } to { transform:scale(1.06); opacity:1; } }
  .booster .count {                  /* 右下角数量徽章 */
    position:absolute; right:-5px; bottom:-3px; min-width:24px; height:24px; padding:0 5px;
    border-radius:999px; border:2px solid #fff;
    background:linear-gradient(#82b6f5,#4a83d6); color:#fff;
    font-size:13px; font-weight:900;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 0 #34619f, 0 3px 6px rgba(30,60,120,.35), inset 0 1px 0 rgba(255,255,255,.55);
    text-shadow:0 1px 1px rgba(0,0,0,.32);
  }
  .booster.empty {                   /* 用完：去色 + 压平 */
    filter:grayscale(.7); opacity:.5;
    box-shadow:0 5px 0 #b9c6d8, 0 7px 9px rgba(50,90,160,.2), inset 0 2px 2px rgba(255,255,255,.9);
  }

  /* 得分飘字：外层只负责居中定位，内层 span 负责位移淡出 */
  .score-float { position:absolute; pointer-events:none; z-index:8; transform:translate(-50%,-50%); }
  .score-float span {
    display:block; font-size:17px; font-weight:900; color:#fff; white-space:nowrap;
    text-shadow:0 2px 0 #e08700, 0 0 8px rgba(255,190,60,.85), 0 1px 3px rgba(0,0,0,.4);
  }

  /* 音量滑块 */
  .vol {
    -webkit-appearance:none; appearance:none; width:72px; height:8px; border-radius:999px;
    background:linear-gradient(#9ec6f5,#cfe3fb); outline:none; cursor:pointer; flex-shrink:0;
    box-shadow:inset 0 1px 3px rgba(60,100,170,.4);
  }
  .vol::-webkit-slider-thumb {
    -webkit-appearance:none; appearance:none; width:20px; height:20px; border-radius:50%;
    background:linear-gradient(#ffffff,#d8e8fb); border:2px solid #6ea7ec;
    box-shadow:0 2px 4px rgba(50,90,160,.45);
  }

  /* 运行时错误兜底条 */
  #crash-bar {
    position:fixed; left:14px; right:14px; bottom:14px; z-index:9999;
    padding:12px 14px; border-radius:12px; text-align:center; cursor:pointer;
    background:#FCEBEB; color:#791F1F; border:1px solid #F09595;
    font-size:13px; font-weight:500; line-height:1.4;
  }

  /* ---------- 通用按钮 ---------- */
  .btn {
    border:none; cursor:pointer; font-family:inherit; font-weight:900; color:#fff;
    border-radius:999px; padding:10px 26px; font-size:18px;
    text-shadow:0 1px 2px rgba(0,0,0,.25);
    transition:transform .1s, filter .15s;
  }
  .btn:active { transform:scale(.94); }
  .btn-orange { background:linear-gradient(#ffcf5c,#ff9d1b); box-shadow:0 4px 0 #d97b00, inset 0 2px 2px rgba(255,255,255,.6); }
  .btn-green  { background:linear-gradient(#a4e05c,#5cb82e); box-shadow:0 4px 0 #3f8c1a, inset 0 2px 2px rgba(255,255,255,.6); }
  .btn-blue   { background:linear-gradient(#7cc4f7,#3d9be9); box-shadow:0 4px 0 #2470b8, inset 0 2px 2px rgba(255,255,255,.6); }
  .btn-purple { background:linear-gradient(#c98ff5,#9b4edd); box-shadow:0 4px 0 #7433ad, inset 0 2px 2px rgba(255,255,255,.6); }

  /* ---------- 弹窗 ---------- */
  .overlay {
    position:fixed; inset:0; background:rgba(40,70,120,.45); backdrop-filter:blur(2px);
    display:none; align-items:center; justify-content:center; z-index:200;
    padding:44px 16px 24px;   /* 上边 44px 是给面板标题留的位置（标题定位在 top:-24px） */
    overflow-y:auto;          /* 面板比视口高时可滚 —— 否则小屏上顶部标题和底部按钮都会被裁掉 */
  }
  .overlay.show { display:flex; }

  /* ---------- 结算插图（胜负特效） ----------
     放在遮罩内部、面板下面（z-index 比 .panel 小）：
     既盖在蓝色蒙层之上（不被压暗），又不会挡住结算面板上的按钮。
     pointer-events:none —— 点插图等于点在遮罩上，不会吃掉按钮的点击。 */
  .end-fx {
    position:absolute; top:0; right:0; bottom:0; left:0; z-index:1;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none; overflow:hidden;
  }
  #result-overlay .panel { z-index:2; }   /* 面板永远压在插图上面 */
  .end-fx img { display:block; visibility:hidden; max-width:none; }
  /* 赢：图片完整显示在面板**上方**那块空档里（横向居中）。
     不铺满全屏 —— 铺满会被居中的面板拦腰压住（看着像穿模），横向还要裁掉两侧；
     放在面板上方则整只奶蛙都看得见，面板也完全不被遮挡。 */
  .end-fx.win { align-items:flex-start; }
  .end-fx.win img {
    visibility:visible; width:auto; height:auto; margin:3vh 0 0;
    /* 面板垂直居中、高约 226px → 上沿 ≈ 50vh-113；再扣掉面板标题位(24)和呼吸位，
       所以图片最高只到 50vh-170 —— 任何屏幕高度下都碰不到面板 */
    max-height:clamp(110px, calc(50vh - 170px), 420px);
    max-width:94vw;
    /* 素材（naikiss_head）是裁到「头 + 脸」的一块，底边是裁切线 ——
       这里用一段遮罩把它淡出去，轮廓才不会出现一条生硬的横边 */
    -webkit-mask-image:linear-gradient(to bottom, #000 0, #000 86%, rgba(0,0,0,0) 100%);
    mask-image:linear-gradient(to bottom, #000 0, #000 86%, rgba(0,0,0,0) 100%);
    animation:endWinIn 2s cubic-bezier(.22,.9,.28,1) both;
  }
  @keyframes endWinIn { from { opacity:0; transform:translateY(16px) scale(.92); } to { opacity:1; transform:none; } }
  /* 输：腿从屏幕右边慢慢伸出来，图片右边界贴在屏幕右边缘 */
  .end-fx.lose img {
    visibility:visible; position:absolute; right:0; bottom:3vh;
    height:min(34vh, 320px); width:auto;
    animation:endLoseIn 1.7s cubic-bezier(.25,.75,.35,1) both;
  }
  @keyframes endLoseIn {
    from { opacity:0; transform:translateX(100%); }
    25%  { opacity:1; }
    to   { opacity:1; transform:translateX(0); }
  }
  /* 设置里关掉「动画」时不做补间，直接呈现终态 */
  .no-anim .end-fx img { animation:none !important; }

  .panel {
    width:min(400px, 94vw); background:#f2f8ff; border:4px solid #6ea7ec; border-radius:22px;
    padding:44px 18px 18px; position:relative; margin:auto;   /* 矮内容居中，高内容从顶部排、可滚 */
    box-shadow:0 8px 24px rgba(30,60,120,.4), inset 0 0 0 2px #fff;
    animation:panelIn .25s ease;
  }
  @keyframes panelIn { from { transform:scale(.85); opacity:0;} to { transform:scale(1); opacity:1;} }
  .panel-title {
    position:absolute; top:-24px; left:50%; transform:translateX(-50%);
    background:linear-gradient(#6ea7ec,#4f87d8); color:#fff; font-size:26px; font-weight:900;
    padding:6px 34px; border-radius:16px; border:3px solid #3f6fc0;
    box-shadow:0 3px 0 #35609f; text-shadow:0 2px 2px rgba(0,0,0,.25);
    display:flex; align-items:center; gap:10px; white-space:nowrap;
  }
  .panel-title .star { font-size:20px; }
  .panel-close {
    position:absolute; top:-18px; right:-14px; width:44px; height:44px; border-radius:50%;
    background:linear-gradient(#ff7b7b,#e83e3e); border:3px solid #b71f1f; color:#fff;
    font-size:22px; font-weight:900; cursor:pointer;
    box-shadow:0 3px 0 #8f1616, inset 0 2px 2px rgba(255,255,255,.5);
  }
  .panel-close:active { transform:scale(.9); }

  .sec-title { color:#2f6fd0; font-weight:900; font-size:15px; margin:12px 4px 6px; }
  .sec-title::before { content:"• "; }
  .sec-title::after { content:" •"; }
  .set-card { background:#fff8ea; border-radius:14px; padding:4px 14px; box-shadow:inset 0 0 0 2px #ffe9bd; }
  .set-row { display:flex; align-items:center; gap:10px; padding:10px 0; }
  .set-row + .set-row { border-top:2px dashed #f0dfba; }
  .set-row .s-icon {
    width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:19px; flex-shrink:0;
    background:radial-gradient(circle at 35% 30%, #ffe08a, #ffb400);
    box-shadow:inset 0 -2px 3px rgba(150,90,0,.35), 0 2px 3px rgba(0,0,0,.15);
  }
  .set-row .s-name { flex:1; font-weight:800; color:#8a5a1e; font-size:16px; }

  /* 开关 */
  .switch {
    width:56px; height:30px; border-radius:999px; background:#cfcfcf; position:relative; cursor:pointer;
    transition:background .2s; box-shadow:inset 0 2px 4px rgba(0,0,0,.2); flex-shrink:0; border:none;
  }
  .switch::after {
    content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, #e8e8e8);

  .combo-float {

  /* ---------- 开始页（仿开心消消乐） ---------- */

    position:fixed; inset:0; z-index:100; overflow:hidden;

</style>

<script>
/* ============================================================
 * 消消乐核心逻辑
 * 图标占位说明：TYPES 数组即消除图标。之后换成自定义图片时，
 * 只需把 emoji 换成 <img> 或背景图渲染即可（见 renderTileFace）。
 * ============================================================ */
const COLS = 7, ROWS = 7;

/* ============================================================
 * 关卡表 —— 加新关卡只改这里
 *   每关字段：
 *     no    关卡号（同时是素材目录名，素材放 naiwa/<no>/）
 *     moves 步数
 *     types 该关的消除图标
 *     needs 三个目标各自需要消除的数量（对应当前关 types 里随机抽出的 3 种）
 *   关卡选择面板、进度存档都从这张表读，不必再改 UI 代码。
 *   素材还没做的关卡不要写进来，面板会自动补成「敬请期待」的锁定格。
 * ============================================================ */
const LEVELS = [
  {
    no: 1,
    moves: 25,
    needs: [15, 12, 10],
    types: [
      { key:'b', img:'naiwa/1/b.png', color:'#7ec3f5' },
      { key:'d', img:'naiwa/1/d.png', color:'#ff9d1b' },

 * 音频引擎
 * BGM / 合成音效 / 结束音效 使用用户提供的 mp3；
 * 点击、交换、无效、道具 仍用 WebAudio 合成做补充。
 * ============================================================ */
let actx = null, sfxGain = null;

/* 外部音频文件 */
const bgmAudio    = new Audio('bgm/bgm.mp3');
bgmAudio.loop = true; bgmAudio.volume = 0.5;
const comboAudios = [1,2,3,4,5].map(i => { const a = new Audio(`bgm/combo${i}.mp3`); a.volume = 0.7; return a; });
const endAudio    = new Audio('bgm/end.mp3');

/* 音量：0~1 的倍数，分别乘到各条音频链的基准值上。
   两条链路基准不同（BGM 文件 0.5 / 合成音效 0.5 / combo 文件 0.7 / 结算文件 0.8），
   所以按链路各自换算 —— 滑到 100 就是改版前的音量。 */
const VOL_KEY = 'naiwa-xxl-vol-v1';
const VOL_BASE = { music:0.5, sfx:0.5 };
const VOL_SFX_FILE = { combo:0.7, end:0.8 };
let volumes = { music:1, sfx:1 };

function loadVolumes(){
  try{
    const o = JSON.parse(localStorage.getItem(VOL_KEY) || '{}');
    for(const k in VOL_BASE){
      const v = parseFloat(o[k]);
      if(isFinite(v)) volumes[k] = Math.max(0, Math.min(1, v));
    }
  }catch(e){}
}
function saveVolumes(){ try{ localStorage.setItem(VOL_KEY, JSON.stringify(volumes)); }catch(e){} }
function applyVolumes(){
  bgmAudio.volume = VOL_BASE.music * volumes.music;
  if(sfxGain) sfxGain.gain.value = VOL_BASE.sfx * volumes.sfx;
  comboAudios.forEach(a=>{ a.volume = VOL_SFX_FILE.combo * volumes.sfx; });
  endAudio.volume = VOL_SFX_FILE.end * volumes.sfx;
  document.querySelectorAll('.vol').forEach(el=>{
    const v = volumes[el.dataset.vol];
    if(v !== undefined) el.value = Math.round(v * 100);
  });
}

function initAudio(){
  if(!actx){
    actx = new (window.AudioContext || window.webkitAudioContext)();
    sfxGain = actx.createGain(); sfxGain.connect(actx.destination);
    applyVolumes();                      /* 按存档音量初始化 */
  } else if(actx.state === 'suspended'){
    actx.resume();
  }
  if(settings.music) tryPlayBgm();
}
/* ---- 浏览器自动播放策略 ----
   手势之前 <audio>.play() 会被拒（NotAllowedError），所以「打开网页就自动响」
   在页面上做不到，只能一有手势立刻解锁 —— 也就是现在这个「点一下才出声」的表现，
   属于平台规则而非 bug。多挂几种事件：pointerdown 覆盖鼠标/触摸，touchend / click
   兜底 iOS Safari（历史上只认 click / touchend 作为媒体播放授权手势），keydown 覆盖键盘。
   下一行的载入尝试只在浏览器放行自动播放时才成功。 */
['pointerdown','touchend','click','keydown'].forEach(ev=>{
  window.addEventListener(ev, initAudio, { once:false, passive:true });
});
window.addEventListener('DOMContentLoaded', ()=>{ if(settings.music) tryPlayBgm(); });

/* WebAudio 合成音效（无文件时兜底） */
function webaudioSfx(freq, dur, type='sine', vol=0.5, slideTo=null, delay=0){
  if(!actx || !settings.sfx) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(sfxGain);
  o.start(t); o.stop(t + dur + 0.05);
}

  click:   () => webaudioSfx(900, 0.08, 'square', 0.25),
  swap:    () => webaudioSfx(520, 0.12, 'sine', 0.4, 880),

  clear:   () => {

  end:     () => { endAudio.currentTime = 0; endAudio.play().catch(()=>{}); },
};

/* ---------- 消除粒子 ----------
   和下落动画同一套 Web Animations 显式关键帧。这里刻意不写 will-change /
   transition：will-change 会把动画提升到合成器线程，而新建图层那一帧可能拿不到
   起始位置快照（之前下落偏移的根因就是这个），粒子会从棋盘左上角飞出来。 */
const PARTICLE_MAX = 140;
let liveParticles = 0;

function burst(r, c, color){
  if(!settings.anim || liveParticles >= PARTICLE_MAX) return;
  const p = pos(r, c);
  const cx = p.x + cell/2, cy = p.y + cell/2;
  for(let i=0;i<4;i++){
    if(liveParticles >= PARTICLE_MAX) return;
    const sz = 5 + rand(4);
    const d = document.createElement('div');
    d.className = 'shard';
    d.style.width  = sz + 'px';
    d.style.height = sz + 'px';
    d.style.left   = (cx - sz/2) + 'px';
    d.style.top    = (cy - sz/2) + 'px';
    d.style.background = color || '#ffffff';
    boardEl.appendChild(d);
    liveParticles++;
    const ang  = (Math.PI * 2 * i / 4) + Math.random() * 1.1;
    const dist = 24 + rand(26);
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 6;
    const dur = 360 + rand(180);
    const anim = d.animate([
      { transform:'translate(0,0) scale(1)', opacity:1 },
      { transform:'translate(' + dx + 'px,' + dy + 'px) scale(.3)', opacity:0 }
    ], { duration: dur, easing:'cubic-bezier(.2,.7,.4,1)' });
    /* 正常路径由 onfinish 回收。但页面切到后台时 Web Animations 会整体暂停，
       onfinish 要等回到前台才来 —— 这段时间粒子节点会一直挂着，
       所以再加一个 setTimeout 兜底（虚拟时间下也会推进），保证节点不堆积。 */
    const kill = function(){
      if(d.__dead) return;
      d.__dead = true;
      liveParticles--;
      if(d.parentNode) d.parentNode.removeChild(d);
    };
    anim.onfinish = kill;
    setTimeout(kill, dur + 400);
  }
}

  t.el.firstChild.innerHTML = `<img src="${TYPES[t.type].img}" alt="" draggable="false">`;
}

/* ---------- 位移 ----------
   为什么位移不再用 CSS transition：
   .tile 上原来挂着 will-change:transform，transform 过渡因此被交给合成器线程执行。
   而一枚棋子「第一次」产生位移的那一帧，合成器的图层才刚建立、手上还没有它的位置
   快照，起始 transform 就退化成 none —— 棋子于是有概率从棋盘左上角飞出来、滑到一半
   才归位，看起来像"错位了一下又回到该在的位置"。这个时序取决于主线程提交与合成器
   建层谁先谁后，所以只「有概率」复现，且真机（真 GPU 合成）比调试环境更容易中招。
   现在改用 Web Animations 的显式关键帧：起止值是一份明确的数据，随动画一起提交给
   合成器，不需要向元素当前渲染状态做快照，从根上避开这个竞态。
   同时元素的 inline transform 永远等于它「该在的格子」，动画只是叠加在上面的表现层，
   所以哪怕动画本身出任何岔子，落点也依然是准的。 */
/* ---------- 下落节奏 ----------
   一格落差用多少毫秒、落差大时追加多少。
   旧实现是固定 220ms：掉 1 格像慢动作，掉 4 格像瞬移 —— 节奏和「重量」都对不上，
   落差越大越显得那一格是"跳"过去的。现在按落差行数给时长并封顶，
   连锁时再乘 dropSpeed(k) 加速。 */
const DROP_BASE_MS = 130, DROP_PER_ROW_MS = 44, DROP_MAX_MS = 380;
function dropDur(rows, k){
  const d = (DROP_BASE_MS + Math.max(1, rows) * DROP_PER_ROW_MS) * (k || 1);
  return Math.round(Math.min(DROP_MAX_MS, d));
}

/* 位移曲线。原来用 ease —— 它最慢的一段恰好是起步（前 30% 只走掉 8% 的路程），
   于是「上方棋子开始下落」的第一印象是"没动"；这段迟滞再和消除的收尾叠在一起，
   主观上就成了「卡一下」。换成前段就冲出去的 ease-out：启动即时、落格减速收住。 */
const MOVE_MS = 220, MOVE_EASE = 'cubic-bezier(.22,.9,.28,1)';

/* 同一枚棋子上正在跑的位移动画。两个用途：
   (a) 判断要不要去读它的实时位移；
   (b) 新动画顶掉旧动画，避免两段叠着算、合成器上的动画对象越堆越多。 */
const TILE_ANIM = new WeakMap();

/* 读元素当前的实际位移。动画进行中拿到的是插值后的当前位置，
   等价于 CSS transition「从当前位置接着走」的打断行为。 */
function readTranslate(el, fallback){
  /* 只有动画正在跑时才需要向渲染层要实时值 —— 静止的棋子直接用它的逻辑位置。
     这里省掉的每一次 getComputedStyle 都是一次强制同步布局：浏览器必须先把
     待处理的样式变更全部 flush 掉，才能回答「你现在在哪」。一轮下落里问十几次，
     既没有意义，本身就是掉帧的来源。 */
  const a = TILE_ANIM.get(el);
  if(!a || (a.playState !== 'running' && a.playState !== 'paused')) return fallback;
  const s = getComputedStyle(el).transform;
  if(!s || s === 'none') return fallback;
  const m = /matrix\(([^)]+)\)/.exec(s);
  if(!m) return fallback;
  const p = m[1].split(',');
  if(p.length < 6) return fallback;
  const x = parseFloat(p[4]), y = parseFloat(p[5]);
  return (isNaN(x) || isNaN(y)) ? fallback : { x: x, y: y };
}

/* 位移到目标点。from 传 null 表示不播动画、直接到位。
   无 Web Animations（老 WebView）时同样直接到位 —— 宁可没有动画，也不能错位。 */
function moveTileTo(el, from, to, dur){
  const fromXY = `translate(${from.x}px, ${from.y}px)`;
  const toXY = `translate(${to.x}px, ${to.y}px)`;
  /* 先停掉上一段动画。必须在 readTranslate（调用方）之后做，否则读不到实时位置；
     也必须在写新的 inline transform 之前做，避免 cancel 时回退到更旧的位置。 */
  const prev = TILE_ANIM.get(el);
  if(prev && prev.playState !== 'finished' && prev.playState !== 'idle') prev.cancel();
  TILE_ANIM['delete'](el);
  if(!from || !settings.anim || !el.animate){ el.style.transform = toXY; return; }
  /* 先把元素钉到起点，再创建动画。若先写终点、动画尚未开始的这一帧被渲染出去，
     棋子会闪到终点再从起点飘过来，表现为'错位了一下又回去'。 */
  el.style.transform = fromXY;
  const a = el.animate(
    [{ transform: fromXY }, { transform: toXY }],
    { duration: dur || MOVE_MS, easing: MOVE_EASE, fill: 'forwards' }
  );
  a.onfinish = function(){ el.style.transform = toXY; try{ TILE_ANIM['delete'](el); }catch(e){} };
  TILE_ANIM.set(el, a);
}

/* 新建棋子。spawnRows > 0 表示这枚棋子从棋盘上方 spawnRows 行处落下。 */
function makeTile(r, c, type, spawnRows=0, dur){
  const el = document.createElement('div');
  el.className = 'tile';
  el.style.width = el.style.height = cell + 'px';
  const face = document.createElement('div');
  face.className = 'face';
  el.appendChild(face);
  const t = { type, el, r, c, caged: isCage(r,c) };
  if(t.caged) el.classList.add('caged');
  renderTileFace(t);
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    /* 注意：必须记录棋子对象本身，运行时读取 t.r/t.c。
       用闭包里的 r/c 会在棋子移动后指向旧格子（滑动错位的根因）。 */
    /* 牢笼棋子不能被拖动，但可以被点击（点选逻辑会忽略它） */
    if(t.caged){ drag = null; return; }
    /* 按下先把 transform 钉到当前格子的落点：上一段位移动画可能还在跑，
       跟手位移需要一个确定的基准，否则会叠在动画的中间值上 */
    const base = pos(t.r, t.c);
    el.style.transform = `translate(${base.x}px, ${base.y}px)`;
    el.classList.add('dragging');
    drag = { t, x: e.clientX, y: e.clientY, base, used: false, slid: false };
  });
  const end = pos(r, c);
  el.style.transform = `translate(${end.x}px, ${end.y}px)`;   /* 基础位置 = 落点 */
  boardEl.appendChild(el);
  if(spawnRows > 0) moveTileTo(el, pos(r - spawnRows, c), end, dur);
  return t;
}

function placeTile(t, r, c, dur){
  const from = readTranslate(t.el, pos(t.r, t.c));
  t.r = r; t.c = c;
  moveTileTo(t.el, from, pos(r, c), dur);
}

/* 落定校正：一轮下落结束后，把所有棋子的 transform 与所属格子强制对齐一次。
   动画本该已经收尾，这里只是兜住任何残留偏差。 */
function settleBoard(){
  forEachActive(function(r,c){
    const t = board[r][c];
    if(t) t.el.style.transform = `translate(${pos(r,c).x}px, ${pos(r,c).y}px)`;
  });
}

function newBoard(){
  boardEl.querySelectorAll('.tile').forEach(e=>e.remove());
  board = Array.from({length:ROWS}, ()=>Array(COLS).fill(null));
  forEachActive(function(r,c){
    let type;
    do { type = rand(TYPES.length); }
    while(
      (c>=2 && board[r][c-1] && board[r][c-2] && board[r][c-1].type===type && board[r][c-2].type===type) ||
      (r>=2 && board[r-1][c] && board[r-2][c] && board[r-1][c].type===type && board[r-2][c].type===type)
    );
    board[r][c] = makeTile(r, c, type);
  });
  if(!findMove()) shuffleBoard(false);
}

/* ---------- 目标 / 顶部栏 ---------- */
function currentLevelDef(){ return LEVELS[level-1] || LEVELS[0]; }

function initGoals(){
  const def = currentLevelDef();
  const idx = [...def.types.keys()].sort(()=>Math.random()-.5).slice(0,3);
  const needs = def.needs || [15,12,10];
  goals = idx.map((t,i)=>({ type:t, need:needs[i] || 10, got:0 }));
  moves = def.moves || 25;
  renderHud();
}

function renderHud(){
  $('#moves-num').textContent = moves;
  $('#score-num').textContent = score;
  const g = $('#goals'); g.innerHTML = '';
  goals.forEach(gl=>{
    const left = Math.max(0, gl.need - gl.got);
    const d = document.createElement('div');
    d.className = 'goal-item' + (left===0 ? ' done' : '');
    d.innerHTML = `<span class="g-icon"><img src="${TYPES[gl.type].img}" alt="" draggable="false"></span><span class="g-num">${left===0?'✓':left}</span>`;
    g.appendChild(d);
  });
  document.querySelectorAll('.booster').forEach(b=>{
    const k = b.dataset.b;
    b.querySelector('.count').textContent = boosters[k];
    b.classList.toggle('empty', boosters[k]<=0);
  });
}

/* ---------- 匹配检测 ---------- */
function findMatches(){
  const hit = new Set();
  // 横向：只扫激活格；遇到非激活格/边界即截断
  for(let r=0;r<ROWS;r++){
    let run=1;
    for(let c=1;c<=COLS;c++){
      if(c<COLS && isActive(r,c) && isActive(r,c-1) && board[r][c] && board[r][c-1] && board[r][c].type===board[r][c-1].type) run++;
      else { if(run>=3) for(let k=c-run;k<c;k++) if(isActive(r,k)) hit.add(r*COLS+k); run=1; }
    }
  }
  // 纵向
  for(let c=0;c<COLS;c++){
    let run=1;
    for(let r=1;r<=ROWS;r++){
      if(r<ROWS && isActive(r,c) && isActive(r-1,c) && board[r][c] && board[r-1][c] && board[r][c].type===board[r-1][c].type) run++;
      else { if(run>=3) for(let k=r-run;k<r;k++) if(isActive(k,c)) hit.add(k*COLS+c); run=1; }
    }
  }
  return hit;
}

function findMove(){
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(!isActive(r,c) || isCage(r,c) || !board[r][c]) continue;
    for(const [dr,dc] of [[0,1],[1,0]]){
      const r2=r+dr, c2=c+dc;
      if(r2<0||r2>=ROWS||c2<0||c2>=COLS||!isActive(r2,c2)||isCage(r2,c2)) continue;
      if(!board[r2][c2]) continue;
      [board[r][c], board[r2][c2]] = [board[r2][c2], board[r][c]];
      const ok = findMatches().size>0;
      [board[r][c], board[r2][c2]] = [board[r2][c2], board[r][c]];
      if(ok) return [{r,c},{r:r2,c:c2}];
    }
  }
  return null;
}

/* ---------- 消除流程 ----------
   节奏：旧实现里这段是三拍严格串行的 ——
     ① 被消除的棋子播 280ms 的 pop 收缩动画（await 到底）
     ② 元素从 DOM 移除
     ③ 上方的棋子这才开始下落
   问题是 ① 播到 200ms 左右棋子已经看不见了，屏幕上却还有 80ms 谁也不动；接着
   ③ 用的又是起步最慢的 ease。这两段合起来，就是主观上的「卡一下」。
   现在把 ① 和 ③ 叠成同一段时间：标记消除的同时就把格子数据清空、让上方开始下落，
   被消除的棋子留在原地把 pop 播完再由定时器收走。屏幕上始终有东西在动。 */
const POP_MS = 200;         /* 与 CSS 里 .tile.clearing .face 的动画时长保持一致 */
const DROP_LEAD_MS = 110;   /* 标记消除后多久开始下落：让 pop 先爆开到最大再掉 */
async function clearSet(hit, combo){
  SFX.clear(combo);
  if(combo>1) showCombo(combo);
  const gained = hit.size * 10 * Math.max(1, combo);
  addScore(gained);
  showScore(hit, gained);
  buzz(combo > 1 ? 22 : 12);
  // 收集目标
  hit.forEach(i=>{
    const r=(i/COLS)|0, c=i%COLS, t=board[r][c];
    if(!t) return;
    const gl = goals.find(g=>g.type===t.type);
    if(gl && gl.got<gl.need) gl.got++;
  });
  renderHud();
  hit.forEach(i=>{
    const r=(i/COLS)|0, c=i%COLS, t=board[r][c];
    if(!t) return;
    t.el.classList.add('clearing');
    const def = TYPES[t.type];
    if(def) burst(r, c, def.color);
    /* 格子数据立刻清空，上方棋子马上就能往下走；DOM 留在原地把 pop 播完再自己
       收走。消除的收缩与上方的下落因此重叠在一起，中间不留空档。
       无动画模式下没有 pop 可播，直接移除。 */
    board[r][c] = null;
    if(settings.anim){
      setTimeout(function(){ if(t.el.parentNode) t.el.parentNode.removeChild(t.el); }, POP_MS + 80);
    } else {
      t.el.remove();
    }
  });
  /* 只让出 pop 的前半程就返回，不等它播完 —— 等到底就会在下落前留出一段空档 */
  if(settings.anim) await sleep(DROP_LEAD_MS);
}

/* 连锁越深落得越快：第 1 段 1.0 倍，之后每段递减 15%，最快 0.55 倍 */
function dropSpeed(combo){
  return Math.max(0.55, 1 - ((combo || 1) - 1) * 0.15);
}

async function dropAndFill(combo){
  const k = dropSpeed(combo);
  let wait = 0;
  for(let c=0;c<COLS;c++){
    /* 先把这一列的压实方案一次算完，再统一播动画。
       两种写法视觉相同，但边扫边写会让「读实时位移」和「改样式」交替发生，
       每一轮交替都可能逼浏览器做一次同步布局；集中处理就没有这个问题。
       整列共用同一个时长 —— 落差各不相同，起止时刻必须一致，堆叠间距才不会散。
       异形棋盘：只在该列的激活格之间压实/补充。 */
    const activeRows = [];
    for(let r=0;r<ROWS;r++) if(isActive(r,c)) activeRows.push(r);
    if(activeRows.length === 0) continue;

    const moves = [];
    let writeIdx = activeRows.length - 1, rows = 0;
    for(let idx=activeRows.length-1; idx>=0; idx--){
      const r = activeRows[idx];
      if(board[r][c]){
        const target = activeRows[writeIdx];
        if(target !== r){
          rows = Math.max(rows, target - r);
          moves.push([board[r][c], target, c]);
          board[target][c] = board[r][c];
          board[r][c] = null;
        }
        writeIdx--;
      }
    }
    /* 顶部空格补新棋子：整列新棋子一起从棋盘上方整体下落，
       保持彼此的堆叠间距（旧算法每枚错开 2 行，最下面那枚会从棋盘内部凭空冒出） */
    const emptyCount = writeIdx + 1;
    const spawnRows = settings.anim ? emptyCount : 0;
    rows = Math.max(rows, spawnRows);
    const dur = settings.anim ? dropDur(rows, k) : 0;
    moves.forEach(function(m){ placeTile(m[0], m[1], m[2], dur); });
    for(let idx=writeIdx; idx>=0; idx--){
      const r = activeRows[idx];
      board[r][c] = makeTile(r, c, rand(TYPES.length), spawnRows, dur);
    }
    if(dur > wait) wait = dur;
  }
  /* 多给 30ms 兜住计时器误差，别让下一轮在位移还没落定时就开跑 */
  await sleep(settings.anim ? wait + 30 : 40);
  settleBoard();
}

async function resolveBoard(){
  let combo = 0;
  while(true){
    const hit = findMatches();
    if(hit.size===0) break;
    combo++;
    busy = true;
    await clearSet(hit, combo);
    await dropAndFill(combo);
  }
  busy = false;
  if(!findMove()){ toast(T('auto_shuffle')); shuffleBoard(true); }
  scheduleHint();
  checkEnd();
}

function showCombo(n){
  const d = document.createElement('div');
  d.id = 'combo-float'; d.textContent = `Combo x${n}!`;
  d.style.left = '50%'; d.style.top = '40%'; d.style.transform = 'translateX(-50%)';
  boardEl.appendChild(d);
  setTimeout(()=>d.remove(), 850);
}

/* 消除处的得分飘字，位置取这组消除的重心。
   和粒子同一套规矩：WAAPI 显式关键帧，回收用 onfinish + setTimeout 双保险。 */
function showScore(hit, gained){
  if(!settings.anim || !gained) return;
  let sx = 0, sy = 0, n = 0;
  hit.forEach(i=>{
    const r = (i/COLS)|0, c = i%COLS;
    if(r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
    const p = pos(r, c);
    sx += p.x + cell/2; sy += p.y + cell/2; n++;
  });
  if(!n) return;
  const d = document.createElement('div');
  d.className = 'score-float';
  const sp = document.createElement('span');
  sp.textContent = '+' + gained;
  d.appendChild(sp);
  d.style.left = Math.round(sx/n) + 'px';
  d.style.top  = Math.round(sy/n) + 'px';
  boardEl.appendChild(d);
  const kill = ()=>{ if(d.parentNode) d.parentNode.removeChild(d); };
  if(sp.animate){
    const a = sp.animate([
      { transform:'translateY(0) scale(.55)',      opacity:0 },
      { transform:'translateY(-16px) scale(1.16)', opacity:1, offset:.32 },
      { transform:'translateY(-46px) scale(1)',    opacity:0 }
    ], { duration:760, easing:'ease-out' });
    a.onfinish = kill;
  }
  setTimeout(kill, 1200);   /* 切后台时 WAAPI 暂停，onfinish 不来，兜底回收 */
}

/* ---------- 交互 ---------- */
function adjacent(a,b){ return Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1; }

/* 交换两格并判定（滑动/点选共用） */
async function trySwap(a, b){
  if(busy || gameOver) return;
  const ta = board[a.r][a.c], tb = board[b.r][b.c];
  if((ta && ta.caged) || (tb && tb.caged)) return;
  busy = true;
  SFX.swap();
  swapTiles(a, b);
  await sleep(230);
  if(findMatches().size===0){
    swapTiles(a, b);              // 换回
    SFX.invalid(); buzz(30);
    toast(T('no_match'));
    moves--; renderHud();         // 无效交换同样消耗一步
    await sleep(230);
    busy = false;
    scheduleHint();
    checkEnd();                   // 这一步可能把步数用完
  } else {
    moves--; renderHud(); buzz(10);
    busy = false;
    await resolveBoard();
  }
}

/* 点按（未滑动时触发）：点选交换 或 使用道具 */
async function onTapSelect(r, c){
  if(busy || gameOver) return;
  clearHint();
  if(boosterMode){ await useBoosterOn(r, c); return; }
  const cur = {r,c};
  const t = board[r][c];
  if(t && t.caged){ deselect(); return; } // 牢笼棋子不能被选中和交换
  if(!selected){ select(cur); return; }
  if(selected.r===r && selected.c===c){ deselect(); return; }
  if(!adjacent(selected, cur)){ select(cur); return; }
  const a = selected; deselect();
  await trySwap(a, cur);
}

/* 滑动手势：按住后棋子跟着手指走（只沿主轴、限幅一格），
   越过阈值立即判定交换；没越过就弹回原格，并当作点按处理。 */
let drag = null;

/* 把棋子从当前跟手位置动画送回它所属的格子 */
function returnTile(d){
  const t = d.t;
  t.el.classList.remove('dragging');
  const to = pos(t.r, t.c);
  moveTileTo(t.el, readTranslate(t.el, to), to);
}

/* 「这个方向不能走」的轻反馈：抖一下内层 .face。
   动画必须作用在 .face 而不是 .tile —— .tile 的 transform 是 inline 定位（translate），
   CSS 关键帧一旦落在 .tile 上会把它整个覆盖掉，棋子会飞到棋盘左上角。 */
function bumpTile(t){
  if(!settings.anim) return;
  const f = t.el.firstChild;
  if(!f) return;
  f.classList.remove('bump');
  void f.offsetWidth;              /* 强制回流，让同名动画能重播 */
  f.classList.add('bump');
  setTimeout(()=>f.classList.remove('bump'), 240);
}

window.addEventListener('pointermove', e => {
  if(!drag || drag.used || busy || gameOver || boosterMode) return;
  // 牢笼棋子不能拖动
  if(drag.t.caged){ drag.used = true; drag.t.el.classList.remove('dragging'); drag = null; return; }
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if(Math.hypot(dx, dy) < cell * 0.35){
    /* 跟手预览：只沿位移更大的那个轴移动，且不超过一格 ——
       否则斜着拖会让棋子飘到不相干的格子上 */
    let ox = 0, oy = 0;
    if(Math.abs(dx) >= Math.abs(dy)) ox = Math.max(-cell, Math.min(cell, dx));
    else oy = Math.max(-cell, Math.min(cell, dy));
    drag.t.el.style.transform = `translate(${drag.base.x + ox}px, ${drag.base.y + oy}px)`;
    return;
  }
  drag.slid = true;                 /* 越过阈值了：松手不再当点选处理 */
  drag.t.el.classList.remove('dragging');
  deselect();
  const [dr, dc] = Math.abs(dx) > Math.abs(dy) ? [0, Math.sign(dx)] : [Math.sign(dy), 0];
  const a = { r: drag.t.r, c: drag.t.c };
  const b = { r: a.r + dr, c: a.c + dc };
  /* 目标格不可去（棋盘外 / 菱形缺角 / 牢笼）：棋子弹回原位，但**这次手势不作废** ——
     把基准点挪到当前位置，玩家手指不抬起来、接着往别的方向滑仍然生效。
     旧写法在这里顺手 drag.used = true，结果「朝牢笼滑一下之后整只手势就失灵了」：
     先右滑撞牢笼、再左滑完全没反应，玩家只能松手重按。
     菱形棋盘中央紧邻牢笼的那两格最容易踩到这个坑，所以必须先归位再重置基准。 */
  if(b.r < 0 || b.r >= ROWS || b.c < 0 || b.c >= COLS || !isActive(b.r,b.c) || isCage(b.r,b.c)){
    returnTile(drag);
    bumpTile(drag.t);
    drag.x = e.clientX; drag.y = e.clientY;
    drag.base = pos(drag.t.r, drag.t.c);
    return;
  }
  drag.used = true;                 /* 真发起交换了，这次手势才就此用掉 */
  clearHint();
  /* 刻意不先归位：trySwap 内部按当前 transform 读动画起点，衔接才连续 */
  trySwap(a, b);
});
window.addEventListener('pointerup', () => {
  if(!drag) return;
  const d = drag;
  drag = null;
  if(d.used) return;
  returnTile(d);
  /* 已经滑过了（哪怕因牢笼/缺角没生效）就不再当点选 ——
     否则"滑一下没滑成、松手反而把棋子选中了"，下一步点哪都变成交换 */
  if(d.slid) return;
  onTapSelect(d.t.r, d.t.c);
});
window.addEventListener('pointercancel', () => {
  if(!drag) return;
  const d = drag;
  drag = null;
  if(!d.used) returnTile(d);
});

function swapTiles(a, b){
  const ta = board[a.r][a.c], tb = board[b.r][b.c];
  if((ta && ta.caged) || (tb && tb.caged)) return;
  board[a.r][a.c] = tb; board[b.r][b.c] = ta;
  placeTile(ta, b.r, b.c); placeTile(tb, a.r, a.c);
}

function select(p){
  selected = p;
  board[p.r][p.c].el.classList.add('selected');
}
function deselect(){
  if(selected) board[selected.r][selected.c].el.classList.remove('selected');
  selected = null;
}

/* ---------- 提示 ---------- */
function scheduleHint(){
  clearHint();
  if(!settings.hint) return;
  hintTimer = setTimeout(()=>{
    const mv = findMove();
    if(mv) mv.forEach(p=>board[p.r][p.c] && board[p.r][p.c].el.classList.add('hint'));
  }, 4000);
}
function clearHint(){
  clearTimeout(hintTimer);
  boardEl.querySelectorAll('.tile.hint').forEach(e=>e.classList.remove('hint'));
}

/* ---------- 道具 ---------- */
document.querySelectorAll('.booster').forEach(b=>{
  b.addEventListener('click', async ()=>{
    if(busy || gameOver) return;
    const k = b.dataset.b;
    if(boosters[k]<=0){ toast(T('booster_empty')); return; }
    if(k==='shuffle'){ boosters[k]--; renderHud(); SFX.booster(); shuffleBoard(true); return; }
    if(k==='moves'){ boosters[k]--; moves+=5; renderHud(); SFX.booster(); toast(T('plus_moves')); return; }
    SFX.click();
    // hammer / bomb 进入选择模式
    boosterMode = (boosterMode===k) ? null : k;
    document.querySelectorAll('.booster').forEach(x=>x.classList.toggle('armed', x.dataset.b===boosterMode));
    toast(k==='hammer' ? T('aim_hammer') : T('aim_bomb'));
  });
});

async function useBoosterOn(r, c){
  if(gameOver) return;
  if(!isActive(r,c)) return;
  const k = boosterMode;
  boosterMode = null;
  document.querySelectorAll('.booster').forEach(x=>x.classList.remove('armed'));
  boosters[k]--; renderHud();
  SFX.booster(); buzz(18);
  const hit = new Set();
  if(k==='hammer') hit.add(r*COLS+c);
  else for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
    const rr=r+dr, cc=c+dc;
    if(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS && isActive(rr,cc)) hit.add(rr*COLS+cc);
  }
  busy = true;
  await clearSet(hit, 0);
  await dropAndFill(1);
  busy = false;
  await resolveBoard();
}

function shuffleBoard(animate){
  // 只收集非牢笼的激活格棋子；牢笼棋子固定不动
  const cells = [], types = [];
  forEachActive(function(r,c){
    const t = board[r][c];
    if(t && !t.caged){ cells.push({r,c}); types.push(t.type); }
  });
  let tries = 0;
  do {
    for(let i=types.length-1;i>0;i--){ const j=rand(i+1); [types[i],types[j]]=[types[j],types[i]]; }
    for(let i=0;i<cells.length;i++){ board[cells[i].r][cells[i].c].type = types[i]; renderTileFace(board[cells[i].r][cells[i].c]); }
    tries++;
  } while((findMatches().size>0 || !findMove()) && tries<50);
  if(animate) toast(T('reshuffled'));
  scheduleHint();
}

/* ---------- 结束判定 ---------- */
function checkEnd(){
  if(gameOver) return;
  const done = goals.every(g=>g.got>=g.need);
  if(done){
    gameOver = true;
    const stars = moves>=10 ? 3 : moves>=5 ? 2 : 1;
    showResult(true, stars);
  } else if(moves<=0){
    gameOver = true;
    showResult(false, 0);
  }
}

/* 结算面板的文案状态：切语言时按这份状态重绘，不必重跑结算逻辑 */
let resultState = null;

function paintResult(){
  if(!resultState) return;
  const st = resultState;
  const mark = st.win ? '⭐' : '💧';
  $('#result-title').innerHTML = '<span class="star">' + mark + '</span>' + (st.win ? T('victory') : T('failure'))
                               + '<span class="star">' + mark + '</span>';
  $('#result-level').textContent = T('level_no', { n: st.level });
  $('#result-stars').innerHTML = st.win
    ? [1,2,3].map(i=>`<span class="${i<=st.stars?'':'dim'}">⭐</span>`).join('')
    : '<span class="dim">⭐⭐⭐</span>';
  /* 文案在重绘这一刻才取，不缓存字符串 —— 结算面板开着切语言也能立刻跟着变 */
  $('#result-text').textContent = st.win ? T('win_text', { n:st.movesLeft }) : T('lose_text');
  $('#result-score').textContent = T('result_score', { n: st.score, s: st.best });
  /* 第二个按钮：赢了 → 下一关 / 返回首页；输了 → 复活（本局没用过才有），
     复活用掉之后失败结算就只剩「重新开始」 */
  const nx = $('#next-level-btn');
  if(st.win){
    nx.style.display = '';
    nx.textContent = T(st.next);
    nx.setAttribute('onclick', st.next === 'next_level' ? 'nextLevel()' : 'goHome()');
  } else if(!reviveUsed){
    nx.style.display = '';
    nx.textContent = T('revive');
    nx.setAttribute('onclick', 'doRevive()');
  } else {
    /* 隐藏时也把文案写回默认值，避免残留上一局的按钮文字 */
    nx.style.display = 'none';
    nx.textContent = T('revive');
  }
}

/* 结算插图：赢了 → 屏幕正中慢慢浮现（盖在蓝色蒙层上、压在面板下，不挡按钮）；
   输了 → 腿从屏幕右边慢慢伸出来，图片右边界贴屏幕右边缘。
   重开一局再结算时靠「清类 → 强制回流 → 加类」让动画重播（只换 src 不会重播）。 */
const OVER_IMG = { win:'naiwa/over/naikiss_head.png', lose:'naiwa/over/naizu.png' };

function hideEndFx(){
  const box = $('#end-fx');
  if(box) box.classList.remove('win','lose');
}

function showEndFx(win){
  const box = $('#end-fx'), img = $('#end-fx-img');
  if(!box || !img) return;
  box.classList.remove('win','lose');
  void box.offsetWidth;          /* 强制回流：否则同一张图第二次出现时动画不重播 */
  img.src = win ? OVER_IMG.win : OVER_IMG.lose;
  box.classList.add(win ? 'win' : 'lose');
}

function showResult(win, stars){
  /* 最高分：不分胜负都记，开局就有分数也能留档 */
  const prevBest = bestOf(level);
  if(score > prevBest) save.best[level] = score;
  /* 记录本次结算状态；第二个按钮由 paintResult() 按胜负决定 */
  resultState = {
    win: win,
    stars: win ? stars : 0,
    movesLeft: moves,
    level: level,
    score: score,
    best: Math.max(prevBest, score),
    next: win ? (level < LEVELS.length ? 'next_level' : 'go_home') : 'none',
  };
  paintResult();
  if(win){
    /* 记进度：星星保留历史最好成绩，并解锁下一关（不会超出关卡表） */
    save.stars[level] = Math.max(starsOf(level), stars);
    save.unlocked = Math.max(save.unlocked, Math.min(LEVELS.length, level + 1));
  }
  persist();
  showEndFx(win);            /* 先把插图摆好，面板一显示动画就跟着开始 */
  setTimeout(()=>{
    $('#result-overlay').classList.add('show');
    if(win && settings.sfx) SFX.end();
    buzz(win ? [20,40,20] : [40,60,40]);
  }, 500);
}

/* 步数用完后的一次复活：本局限一次，棋盘 / 分数 / 目标进度全部保留 */
function doRevive(){
  if(reviveUsed) return;
  reviveUsed = true;
  gameOver = false;
  moves += 5;
  closeOverlay('result-overlay');
  resultState = null;
  busy = false;
  renderHud();
  SFX.booster(); buzz(18);
  toast(T('revived'));
  scheduleHint();
}

/* 进入指定关卡（关卡表里没有的关不进来，走 toast 提示那条分支） */
function startLevel(no){
  const def = LEVELS[no-1];
  if(!def){ toast(T('level_wip', { n:no })); return; }
  level = def.no;
  TYPES = def.types;
  activeShape = def.shape || null;
  cagePos = def.cage || null;
  document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('show'));
  $('#home').classList.add('hide');
  refreshHome();
  restart();
}

function nextLevel(){
  if(level >= LEVELS.length){ goHome(); return; }
  startLevel(level + 1);
}

function restart(){
  gameOver = false;
  hideEndFx();
  score = 0; reviveUsed = false;
  boosters = Object.assign({}, BOOSTER_MAX);   /* 道具每关复原 */
  deselect(); boosterMode = null;
  document.querySelectorAll('.booster').forEach(x=>x.classList.remove('armed'));
  initGoals();
  layoutBoard();
  newBoard();
  scheduleHint();
}

/* ---------- 弹窗 ---------- */
function closeOverlay(id){
  document.getElementById(id).classList.remove('show');
  /* 面板收起来时把插图一起撤掉，免得下次开局还挂着上一局的胜负图 */
  if(id === 'result-overlay') hideEndFx();
}

/* ---------- 关卡选择 ----------
   格子数 = max(LEVEL_SLOTS, 关卡表长度)：关卡表里没有素材的编号一律渲染成
   T('coming_soon') 锁定格，所以以后往 LEVELS 里追加一条，这里的锁定格会自动减少。 */
function renderLevelSelect(){
  const grid = $('#level-grid');
  if(!grid) return;
  grid.innerHTML = '';
  const total = Math.max(LEVEL_SLOTS, LEVELS.length);
  const max = unlockedMax();
  for(let i=1;i<=total;i++){
    const def = LEVELS[i-1];
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'lv-node';
    b.dataset.level = i;
    if(!def){
      b.className += ' soon';
      b.innerHTML = '<span class="lv-no">🔒</span><span class="lv-sub">' + T('coming_soon') + '</span>';
    } else {
      const st = starsOf(i);
      if(i > max) b.className += ' locked';
      if(i === level) b.className += ' current';
      b.innerHTML = '<span class="lv-no">' + i + '</span>'
                  + '<span class="lv-sub">'
                  + [0,1,2].map(k => `<i class="${k < st ? 'on' : ''}">★</i>`).join('')
                  + '</span>';
    }
    grid.appendChild(b);
  }
}

/* 开始页文案 + 关卡面板同步刷新（回首页 / 结算 / 切关 / 切语言后都调一次） */
function refreshHome(){
  $('#home-level-pre').textContent = T('progress_pre');
  $('#home-level').textContent = unlockedMax();
  $('#home-level-post').textContent = T('progress_post');
  /* 开始页的最高分取所有关卡里最好的那一次；一次都没打完过就不显示 */
  let top = 0;
  LEVELS.forEach(function(l){ top = Math.max(top, bestOf(l.no)); });
  const hb = $('#home-best');
  if(hb) hb.textContent = top > 0 ? T('home_best', { n: top }) : '';
  renderLevelSelect();
}

function openLevels(){ SFX.click(); renderLevelSelect(); $('#levels-overlay').classList.add('show'); }

/* ---------- 开始页 ---------- */
function goHome(){
  document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('show'));
  refreshHome();
  $('#home').classList.remove('hide');
}
/* 「开始游戏」直接进当前进度关（已解锁的最新一关） */
$('#btn-start').addEventListener('click', ()=>{
  initAudio(); SFX.click();
  startLevel(unlockedMax());
});
/* 关卡格：点已做的关卡进游戏，点锁定格给提示 */
$('#level-grid').addEventListener('click', e=>{
  let node = e.target;
  while(node && node !== e.currentTarget && !(node.dataset && node.dataset.level)) node = node.parentNode;
  if(!node || node === e.currentTarget) return;
  const no = parseInt(node.dataset.level, 10);
  if(LEVELS[no-1]) startLevel(no);
  else { SFX.invalid(); toast(T('level_wip', { n:no })); }
});
$('#gear-btn').addEventListener('click', ()=>{ SFX.click(); $('#settings-overlay').classList.add('show'); });
$('#home-gear').addEventListener('click', ()=>{ SFX.click(); $('#settings-overlay').classList.add('show'); });
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', ()=>closeOverlay(b.dataset.close)));
/* 点空白处关弹窗 —— 结算面板例外：本局已经结束、棋盘被 gameOver 锁着，
   空白处一点就把面板关掉，玩家就再也找不到入口了（表现为「点哪都没反应」）。
   所以结算面板只能通过里面的按钮离开。 */
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click', e=>{
  if(e.target!==o) return;
  if(o.id === 'result-overlay') return;
  o.classList.remove('show');
}));

document.querySelectorAll('.switch').forEach(sw=>{
  sw.addEventListener('click', ()=>{
    sw.classList.toggle('on');
    settings[sw.dataset.set] = sw.classList.contains('on');
    SFX.click();
    if(sw.dataset.set==='hint'){ clearHint(); if(settings.hint) scheduleHint(); }
    if(sw.dataset.set==='music'){ settings.music ? startBgm() : stopBgm(); }
    if(sw.dataset.set==='anim'){ applyAnimSetting(); }
  });
});
/* 语言切换：中文 / English，选择存 localStorage，下次进来还是上次那档 */
document.querySelectorAll('#lang-seg .seg-btn').forEach(b=>{
  b.addEventListener('click', ()=>setLang(b.dataset.lang));
});

/* ---------- 运行时错误兜底 ----------
   线上没法看 console，出错必须给用户一个可点的出口；只提示一次，避免连锁错误刷屏。 */
let crashShown = false;
function reportCrash(what){
  try{
    window.__xxlLastError = what;
    if(crashShown) return;
    crashShown = true;
    const bar = document.createElement('div');
    bar.id = 'crash-bar';
    bar.textContent = T('crash_tip');
    bar.addEventListener('click', ()=>{ try{ location.reload(); }catch(e){} });
    document.body.appendChild(bar);
  }catch(e){}
}
window.addEventListener('error', e=>reportCrash(e.message || 'error'));
window.addEventListener('unhandledrejection', e=>reportCrash((e.reason && e.reason.message) || 'rejection'));

/* 切回前台自愈：后台时 Web Animations 会整体暂停，若卡在动画中间，
   busy 会一直锁着输入，回来点哪都没反应。 */
document.addEventListener('visibilitychange', function(){
  if(document.hidden || !busy) return;
  setTimeout(function(){
    if(!busy) return;
    const anims = document.getAnimations ? document.getAnimations() : null;
    if(anims && anims.some(a=>a.playState === 'running')) return;
    busy = false;
    deselect();
    settleBoard();
  }, 450);
});

/* 音量滑块：拖动实时改增益并落盘，松手时音效试听一下 */
document.querySelectorAll('.vol').forEach(el=>{
  el.addEventListener('input', ()=>{
    volumes[el.dataset.vol] = el.value / 100;
    applyVolumes();
    saveVolumes();
  });
  el.addEventListener('change', ()=>{
    if(el.dataset.vol === 'sfx') SFX.click();
  });
});

/* ---------- 启动 ---------- */
window.addEventListener('resize', ()=>{ layoutBoard(); for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){ const t=board[r]&&board[r][c]; if(t) placeTile(t,r,c); } });
loadLang();       /* 语言存档要在任何 T() 之前读出来 */
loadVolumes();
loadSave();
initGoals();
layoutBoard();
applyAnimSetting();
newBoard();
scheduleHint();
applyLang();     /* 铺文案 + 高亮语言分段控件 + 刷新开始页/关卡面板/顶部栏 */
applyVolumes();  /* 把存档音量回填到滑块（音频链在 initAudio 里初始化） */
</script>
</body>
</html>
